services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_DB: radin
    ports:
      - "5432:5432"
    volumes:
      - radin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radin -d radin"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  radin_pgdata:
